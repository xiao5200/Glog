id: builtin-win-4625
name: Windows登录失败
description: 检测同一计算机上短时间内大量 Windows 4625 登录失败事件
version: "1.0"
author: GLog Team
severity: high
enabled: true
tags:
  - windows
  - logon_failure
  - event_4625
mitre_attack:
  tactics:
    - Credential Access
  techniques:
    - T1110
detection:
  filter:
    - field: event_id
      op: eq
      value: 4625
  group_by:
    - computer
  condition: count > 10 within 5m
actions:
  tags:
    - windows
    - brute_force
  risk_score: 75
  alert:
    title: 检测到 Windows 登录暴力破解
    message: 同一计算机在 5 分钟内出现超过 10 次登录失败
examples:
  - "EventID=4625 Provider=Microsoft-Windows-Security-Auditing Computer=WIN-DC01 An account failed to log on."
