id: builtin-path-traversal
name: 路径穿越攻击
description: 检测 URL 编码与明文形式的目录穿越及敏感文件读取
version: "1.0"
author: GLog Team
severity: high
enabled: true
tags:
  - traversal
  - web
  - lfi
mitre_attack:
  tactics:
    - Initial Access
  techniques:
    - T1190
    - T1083
detection:
  filter:
    - field: message
      op: regex
      value: '(?i)(\.\./\.\./|%2e%2e%2f|/etc/passwd|win\.ini|\.\.\\)'
  condition: count > 0
actions:
  tags:
    - path_traversal
    - lfi
  risk_score: 80
  alert:
    title: 检测到路径穿越尝试
    message: 请求包含目录穿越序列或敏感文件路径
examples:
  - "GET /../../../../etc/passwd HTTP/1.1"
  - "GET /download?file=..%2e%2e%2f..%2e%2e%2fwin.ini HTTP/1.1"
