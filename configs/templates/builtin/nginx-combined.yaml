id: nginx-combined
name: Nginx Access (Combined)
description: Nginx 默认 combined 访问日志，包含客户端地址、时间、请求行、状态码、响应字节数、Referer 与 User-Agent。
type: builtin
category: web_server
format: regex
priority: 80
regex: '^(\S+) \S+ \S+ \[([^\]]+)\] "(\S+) (\S+) (\S+)" (\d{3}) (\S+) "([^"]*)" "([^"]*)"'
field_map:
  remote_addr: 1
  time_local: 2
  method: 3
  path: 4
  protocol: 5
  status: 6
  bytes: 7
  referer: 8
  user_agent: 9
time_format: '02/Jan/2006:15:04:05 -0700'
time_field: time_local
level_field: ''
level_map: {}
level_extraction:
  field: status
  rules:
    - range: [200, 399]
      level: INFO
    - range: [400, 499]
      level: WARN
    - range: [500, 999]
      level: ERROR
  default: INFO
examples:
  - '127.0.0.1 - - [10/Oct/2024:13:55:36 +0800] "GET /index.html HTTP/1.1" 200 612 "-" "Mozilla/5.0"'
  - '203.0.113.10 - admin [10/Oct/2024:13:55:37 +0800] "POST /api/login HTTP/1.1" 401 128 "https://example.com/" "curl/8.0"'
