id: syslog-rfc5424
name: Syslog RFC5424
description: 现代 syslog（RFC5424），包含版本、RFC3339 时间、主机、应用、进程、MSGID 与结构化数据。
type: builtin
category: system
format: syslog
priority: 62
regex: '^<\d{1,3}>\d+ \S+ \S+ \S+ \S+ \S+ .*$'
field_map: {}
time_format: '2006-01-02T15:04:05.000Z07:00'
time_field: ''
level_field: ''
level_map: {}
examples:
  - '<34>1 2024-10-11T22:14:15.003Z web-01 sshd 1234 ID47 - Failed password for root from 192.0.2.1 port 22 ssh2'
  - '<165>1 2024-10-11T22:14:15.003Z mymachine.example.com evntslog - ID47 [exampleSDID@32473 iut="3"] An application event log entry'
