id: syslog-rfc3164
name: Syslog RFC3164
description: 传统 BSD syslog（RFC3164），可选 PRI，时间为无年份的 Mon DD HH:MM:SS，按当前年份解析。
type: builtin
category: system
format: syslog
priority: 60
regex: '^(?:<\d{1,3}>)?[A-Z][a-z]{2} +\d{1,2} \d{2}:\d{2}:\d{2} \S+ .*$'
field_map: {}
time_format: 'Jan _2 15:04:05'
time_field: ''
level_field: ''
level_map: {}
examples:
  - '<34>Oct 11 22:14:15 mymachine su: su root failed for lonvick on /dev/pts/8'
  - 'Oct 11 22:14:15 mymachine sshd[1234]: Failed password for root from 192.0.2.1 port 22 ssh2'
