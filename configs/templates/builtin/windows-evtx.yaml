id: windows-evtx
name: Windows Event (Normalized JSON)
description: 采集器 evtx 标准化后的 JSON，包含 timestamp、level、event_id、provider、computer、user_id、message 与 fields 对象。
type: builtin
category: windows
format: json
priority: 90
regex: ''
field_map: {}
time_format: ''
time_field: timestamp
level_field: level
level_map:
  information: INFO
  informational: INFO
  warning: WARN
  error: ERROR
  critical: CRITICAL
  verbose: DEBUG
examples:
  - '{"timestamp":"2024-10-10T14:00:01.1234567Z","level":"Information","event_id":4624,"provider":"Microsoft-Windows-Security-Auditing","computer":"DC01.example.com","user_id":"S-1-5-21-1","message":"An account was successfully logged on.","fields":{"TargetUserName":"alice","LogonType":3}}'
  - '{"timestamp":"2024-10-10T14:00:02Z","level":"Error","event_id":4625,"provider":"Microsoft-Windows-Security-Auditing","computer":"DC01.example.com","user_id":"S-1-5-21-2","message":"An account failed to log on.","fields":{"TargetUserName":"bob","IpAddress":"203.0.113.9"}}'
