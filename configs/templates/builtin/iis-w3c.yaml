id: iis-w3c
name: IIS W3C Extended Log
description: IIS W3C 扩展日志空格分隔格式，日期与时间合并解析，按 sc-status 映射级别。
type: builtin
category: web_server
format: regex
priority: 78
regex: '^(\d{4}-\d{2}-\d{2}) (\d{2}:\d{2}:\d{2}) (\S+) (\S+) (\S+) (\S+) (\S+) (\S+) (\S+) (\S+) (\d{3}) (\S+) (\S+) (\S+)(?: .*)?$'
field_map:
  date: 1
  time: 2
  s_ip: 3
  cs_method: 4
  cs_uri_stem: 5
  cs_uri_query: 6
  s_port: 7
  cs_username: 8
  c_ip: 9
  cs_user_agent: 10
  sc_status: 11
  sc_substatus: 12
  sc_win32_status: 13
  time_taken: 14
time_format: '2006-01-02 15:04:05'
time_field: ''
level_field: ''
level_map: {}
level_extraction:
  field: sc_status
  rules:
    - range: [200, 399]
      level: INFO
    - range: [400, 499]
      level: WARN
    - range: [500, 999]
      level: ERROR
  default: INFO
examples:
  - '2024-10-10 14:00:01 192.168.1.100 GET /index.html - 80 - 203.0.113.10 Mozilla/5.0+(Windows+NT+10.0;+Win64;+x64) 200 0 0 123'
  - '2024-10-10 14:00:02 192.168.1.100 POST /api/login - 443 - 198.51.100.7 python-requests/2.31.0 500 0 0 45'
